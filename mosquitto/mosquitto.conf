# Local Mosquitto broker for this project (Mosquitto 2.x).
# Start it in its own terminal from the repository root:
#     mosquitto -c mosquitto/mosquitto.conf
# The Python scripts use localhost by default.

# Only accept local connections; no authentication needed on localhost.
listener 1883 127.0.0.1
allow_anonymous true

# Mosquitto's defaults queue at most 1000 messages for a subscriber that falls behind and
# silently DROP the rest. During a fast backfill the subscriber can briefly lag the publisher,
# so the per-client queue is unlimited (0) to guarantee that no QoS 1 message is lost.
max_queued_messages 0
max_queued_bytes 0

# Allow many un-acknowledged QoS 1 messages per client. The subscriber acknowledges a message only
# after it has been committed to DuckDB (in batches), so the default of 20 would throttle it.
max_inflight_messages 2000

# Keep queued messages of persistent sessions in memory only (nothing written to disk).
persistence false
log_type error
log_type warning
log_type notice
